<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon_192.png">
    <link rel="apple-touch-icon" href="/icon_192.png">
    <title>BlindGuard 智能导盲系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 { font-size: 20px; }
        .logo p { font-size: 12px; opacity: 0.7; }
        .main-container {
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .video-section {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
        }
        .video-header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .video-container {
            background: #000;
            aspect-ratio: 4/3;
            max-height: 500px;
            position: relative;
        }
        .video-container img { width: 100%; height: 100%; object-fit: contain; }
        .overlay-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 视频控制栏 */
        .video-controls {
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-bar {
            flex: 1;
            min-height: 24px;
            background: transparent;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            outline: none;
            touch-action: manipulation;
        }
        .progress-bar::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .progress-fill {
            position: relative;
            z-index: 1;
            height: 6px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .progress-bar:hover .progress-fill,
        .progress-bar:focus-visible .progress-fill {
            height: 8px;
        }
        .progress-bar:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .time-display {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            min-width: 100px;
        }
        .speed-btn, .control-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .speed-btn:hover, .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .speed-btn.active {
            background: #667eea;
        }

        .control-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .panel-card h3 { font-size: 16px; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #eb3349, #f45c43); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .status-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .status-label { font-size: 12px; opacity: 0.7; }
        .status-value { font-size: 24px; font-weight: 600; }
        .status-value.normal { color: #38ef7d; }
        .risk-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 10px;
        }
        .risk-dot { width: 12px; height: 12px; border-radius: 50%; }
        .risk-dot.safe { background: #38ef7d; box-shadow: 0 0 10px #38ef7d; }
        .risk-dot.low { background: #667eea; box-shadow: 0 0 10px #667eea; }
        .risk-dot.medium { background: #f4a261; box-shadow: 0 0 10px #f4a261; }
        .risk-dot.high { background: #f45c43; box-shadow: 0 0 10px #f45c43; }
        .risk-dot.critical { background: #ff0040; box-shadow: 0 0 14px #ff0040; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .detection-list { max-height: 300px; overflow-y: auto; }
        .detection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .message-area {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            min-height: 60px;
        }
        .message { font-size: 14px; line-height: 1.6; }
        .message.warning { color: #f45c43; }
        .message.info { color: #667eea; }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #667eea; }
        .upload-area:focus-visible {
            border-color: #fff;
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
        .upload-area input { display: none; }
        /* 智能对话面板 */
        .agent-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .agent-badge.on { background: rgba(56,239,125,0.2); color: #38ef7d; }
        .agent-badge.off { background: rgba(244,92,67,0.2); color: #f45c43; }
        .safety-note {
            color: #ffd166;
            font-size: 12px;
            line-height: 1.45;
            margin: -7px 0 10px;
        }
        .chat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .chat-msg { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
        .chat-msg.user { color: #667eea; text-align: right; }
        .chat-msg.bot { color: #fff; }
        .chat-msg .role { font-size: 11px; opacity: 0.5; margin-bottom: 2px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .chat-input-row input:focus { border-color: #667eea; }
        .chat-input-row button { flex: 0 0 auto; padding: 10px 18px; }
        .mic-btn { flex: 0 0 auto; padding: 10px 14px !important; font-size: 16px; }
        .mic-btn.listening { background: #eb3349; animation: pulse 1s infinite; }
        .det-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.12);
            padding: 1px 6px;
            border-radius: 6px;
            margin-left: 4px;
            white-space: nowrap;
        }
        .det-tag.warn { color: #f4a261; }
        .det-tag.green { color: #38ef7d; }
        .conf-bar {
            height: 5px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
            width: 130px;
        }
        .conf-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #38ef7d);
            border-radius: 3px;
        }
        .det-sub { font-size: 11px; opacity: 0.65; margin-top: 4px; }
        /* 播报时间线（参考 Frigate 事件流） */
        .timeline {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }
        .timeline-item {
            padding: 6px 10px;
            border-left: 3px solid #667eea;
            background: rgba(255,255,255,0.04);
            border-radius: 0 6px 6px 0;
            margin-bottom: 5px;
        }
        .timeline-item .tl-time { font-size: 10px; opacity: 0.5; }
        .timeline-item.critical { border-left-color: #ff0040; }
        .timeline-item.high { border-left-color: #f45c43; }
        .timeline-item.medium { border-left-color: #f4a261; }
        .timeline-item.seekable { cursor: pointer; }
        .timeline-item.seekable:hover { background: rgba(102,126,234,0.18); }
        /* 快捷提问 chips */
        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .chip {
            font-size: 12px;
            padding: 5px 10px;
            background: rgba(102,126,234,0.18);
            border: 1px solid rgba(102,126,234,0.4);
            border-radius: 14px;
            color: #c5cae9;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { background: rgba(102,126,234,0.35); color: #fff; }
        /* 头部工具按钮 */
        .header-tools { display: flex; gap: 10px; align-items: center; }
        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.2); }
        /* 高对比度大字模式（低视力用户 / WCAG AA） */
        body.hc {
            background: #000 !important;
            font-size: 18px;
        }
        body.hc .panel-card, body.hc .header, body.hc .video-header { background: #0a0a0a !important; border: 2px solid #ffe600; }
        body.hc .status-value, body.hc .message, body.hc .chat-msg, body.hc .detection-item, body.hc .det-sub { color: #ffe600 !important; font-size: 17px; }
        body.hc .message.warning, body.hc .det-tag.warn { color: #ff5252 !important; }
        body.hc .conf-bar { height: 8px; background: #333; }
        body.hc .conf-bar i { background: #ffe600; }
        body.hc .timeline-item { color: #ffe600; }
        body.hc .chip { color: #ffe600; border-color: #ffe600; }
        body.hc h1, body.hc h3 { color: #ffe600; }
        body.hc .video-placeholder, body.hc .video-placeholder small { color: #ffe600; }
        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .control-panel { width: 100%; }
        }
        @media (max-width: 600px) {
            .header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
            .main-container { padding: 10px; gap: 12px; }
            .panel-card { padding: 14px; }
            .btn { padding: 12px 14px; font-size: 15px; }
            .chip {
                min-height: 44px;
                padding: 10px 14px;
                font-size: 13px;
            }
            .chat-box { max-height: 150px; }
            .detection-list { max-height: 220px; }
            .tool-btn {
                min-height: 44px;
                padding: 8px 12px;
                font-size: 13px;
            }
            .progress-bar { min-height: 44px; }
            .chat-input-row input,
            .chat-input-row button { min-height: 44px; }
            .mic-btn { font-size: 14px; }
        }

        /* iOS 浅色分组风格 */
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-fill: #f2f2f7;
            --ios-label: #1c1c1e;
            --ios-secondary: #6c6c70;
            --ios-tertiary: #8e8e93;
            --ios-separator: rgba(60, 60, 67, 0.14);
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --ios-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            color-scheme: light;
        }

        html {
            background: var(--ios-bg);
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--ios-bg);
            color: var(--ios-label);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: calc(12px + env(safe-area-inset-top))
                max(20px, calc((100vw - 1400px) / 2)) 12px;
            background: rgba(242, 242, 247, 0.88);
            border-bottom: 1px solid var(--ios-separator);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
        }

        .logo h1 {
            color: var(--ios-label);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1.2;
        }

        .logo p {
            margin-top: 3px;
            color: var(--ios-secondary);
            font-size: 12px;
            opacity: 1;
        }

        .main-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-section {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            background: var(--ios-card);
            border: 1px solid var(--ios-separator);
            border-radius: 8px;
            box-shadow: var(--ios-shadow);
        }

        .video-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            background: var(--ios-card);
            border-bottom: 1px solid var(--ios-separator);
        }

        .video-header h3,
        .panel-card h3 {
            color: var(--ios-label);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .video-header h3 {
            margin: 0;
        }

        .video-container {
            aspect-ratio: 16 / 9;
            max-height: 520px;
            background: #000;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.78);
            background: #000;
            pointer-events: none;
        }

        .video-placeholder p { margin: 0; font-size: 15px; font-weight: 600; }

        .video-placeholder small { color: rgba(255, 255, 255, 0.45); font-size: 12px; line-height: 1.5; }

        .video-controls {
            display: grid;
            grid-template-columns: auto minmax(140px, 1fr) auto auto;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: var(--ios-secondary);
            background: var(--ios-card);
            border-top: 1px solid var(--ios-separator);
        }

        .video-controls .btn-group {
            display: grid;
            grid-template-columns: repeat(4, minmax(48px, 1fr));
            gap: 6px;
            min-width: 228px;
            margin: 0;
        }

        .control-btn,
        .speed-btn {
            min-height: 40px;
            border: 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .control-btn {
            min-width: 56px;
            padding: 0 14px;
            color: #fff;
            background: var(--ios-blue);
        }

        .control-btn:hover {
            background: #006edc;
        }

        .speed-btn {
            padding: 0 10px;
            color: var(--ios-label);
            background: var(--ios-fill);
        }

        .speed-btn:hover {
            background: #e5e5ea;
        }

        .speed-btn.active {
            color: #fff;
            background: var(--ios-blue);
        }

        .speed-btn.active:hover {
            background: #006edc;
        }

        .progress-bar {
            min-height: 40px;
        }

        .progress-bar::before {
            height: 6px;
            background: #d1d1d6;
            border-radius: 3px;
        }

        .progress-fill {
            height: 6px;
            background: var(--ios-blue);
            border-radius: 3px;
        }

        .progress-bar:hover .progress-fill,
        .progress-bar:focus-visible .progress-fill {
            height: 8px;
        }

        .time-display {
            min-width: 92px;
            color: var(--ios-secondary);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }

        .control-panel {
            width: 360px;
            gap: 16px;
        }

        .panel-card {
            padding: 18px;
            background: var(--ios-card);
            border: 1px solid var(--ios-separator);
            border-radius: 8px;
            box-shadow: var(--ios-shadow);
        }

        .panel-card h3 {
            margin-bottom: 14px;
        }

        .btn-group {
            gap: 10px;
            min-width: 0;
        }

        .btn {
            min-width: 0;
            min-height: 44px;
            padding: 11px 14px;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0;
            transition: background-color 0.16s ease, opacity 0.16s ease,
                transform 0.16s ease;
        }

        .btn-primary {
            color: #fff;
            background: var(--ios-blue);
        }

        .btn-success {
            color: #fff;
            background: var(--ios-green);
        }

        .btn-danger {
            color: #fff;
            background: var(--ios-red);
        }

        .btn-secondary {
            color: var(--ios-blue);
            background: #e5e5ea;
        }

        .btn:disabled,
        .tool-btn:disabled,
        .speed-btn:disabled,
        .control-btn:disabled {
            opacity: 0.46;
            cursor: not-allowed;
        }

        .btn:not(:disabled):active,
        .tool-btn:not(:disabled):active,
        .speed-btn:not(:disabled):active,
        .control-btn:not(:disabled):active,
        .chip:active {
            transform: scale(0.98);
        }

        .tool-btn {
            min-height: 36px;
            padding: 8px 13px;
            color: var(--ios-blue);
            background: rgba(118, 118, 128, 0.12);
            border: 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .tool-btn:hover {
            background: rgba(118, 118, 128, 0.18);
        }

        .status-grid {
            gap: 8px;
        }

        .status-item,
        .risk-indicator,
        .message-area,
        .chat-box,
        .detection-item,
        .timeline-item {
            background: var(--ios-fill);
            border-radius: 8px;
        }

        .status-item {
            padding: 14px 12px;
        }

        .status-label {
            color: var(--ios-secondary);
            font-size: 12px;
            opacity: 1;
        }

        .status-value {
            margin-top: 3px;
            color: var(--ios-label);
            font-size: 23px;
            font-weight: 650;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }

        .status-value.normal {
            color: var(--ios-label);
        }

        .risk-indicator {
            gap: 12px;
            margin-top: 10px;
            padding: 14px;
        }

        .risk-indicator .status-value {
            font-size: 17px;
        }

        .risk-dot {
            flex: 0 0 auto;
            width: 11px;
            height: 11px;
            box-shadow: none;
        }

        .risk-dot.safe {
            background: var(--ios-green);
        }

        .risk-dot.low {
            background: var(--ios-blue);
        }

        .risk-dot.medium {
            background: var(--ios-orange);
        }

        .risk-dot.high,
        .risk-dot.critical {
            background: var(--ios-red);
        }

        .risk-dot.critical {
            box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.14);
        }

        /* 风险等级文字随等级着色（不再仅靠圆点颜色区分） */
        .risk-text.safe { color: var(--ios-green); }
        .risk-text.low { color: var(--ios-blue); }
        .risk-text.medium { color: var(--ios-orange); }
        .risk-text.high { color: var(--ios-red); }
        .risk-text.critical { color: var(--ios-red); font-weight: 700; }

        .message-area {
            min-height: 62px;
            padding: 14px;
        }

        .message {
            color: var(--ios-label);
            font-size: 14px;
            line-height: 1.55;
        }

        .message.info {
            color: var(--ios-blue);
        }

        .message.warning {
            color: var(--ios-red);
        }

        .detection-list {
            max-height: 300px;
        }

        .detection-item {
            margin-bottom: 8px;
            padding: 11px 12px;
        }

        .detection-item:last-child {
            margin-bottom: 0;
        }

        .det-tag {
            padding: 2px 7px;
            color: var(--ios-secondary);
            background: rgba(118, 118, 128, 0.12);

<body>
    <header class="header">
        <div class="logo">
            <div>
                <h1>BlindGuard</h1>
                <p>智能导盲系统 V{{ version }} · 多模态感知智能体</p>
            </div>
        </div>
        <div class="header-tools">
            <button class="tool-btn" id="btnContrast" onclick="toggleContrast()"
                    aria-label="切换高对比度大字模式" aria-pressed="false">👁 大字模式</button>
        </div>
    </header>

    <main class="main-container">
        <section class="video-section">
            <div class="video-header">
                <h3>实时监控</h3>
                <button class="tool-btn" id="btnOverlay" onclick="toggleOverlay()"
                        aria-label="切换中文标签覆盖层" aria-pressed="true">标签层: 开</button>
            </div>
            <div class="video-container" id="videoContainer">
                <img id="videoFeed" src="{{ video_feed_url }}" alt="视频流">
                <canvas id="overlay" class="overlay-canvas"></canvas>
                <div class="video-placeholder" id="videoPlaceholder">
                    <p id="videoPlaceholderText">尚未开始检测</p>
                    <small>启动系统并开启摄像头，或上传视频后，这里会显示实时画面</small>
                </div>
            </div>
            <!-- 视频控制栏 -->
            <div class="video-controls" id="videoControls" style="display:none;">
                <button class="control-btn" id="btnPause" onclick="togglePause()">暂停</button>
                <div class="progress-bar" id="progressBar" role="slider" tabindex="0"
                     aria-label="视频进度" aria-valuemin="0" aria-valuemax="0"
                     aria-valuenow="0" aria-valuetext="0:00 / 0:00"
                     onclick="seekVideo(event)" onkeydown="seekVideoByKeyboard(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                <div class="btn-group">
                    <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="speed-btn active" onclick="setSpeed(1.0)">1x</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="speed-btn" onclick="setSpeed(2.0)">2x</button>
                </div>
            </div>
        </section>

        <aside class="control-panel">
            <div class="panel-card">
                <h3>系统控制</h3>
                <div class="btn-group">
                    <button class="btn btn-success" id="btnStartSystem" onclick="startSystem()">启动系统</button>
                    <button class="btn btn-danger" id="btnStopSystem" onclick="stopSystem()" disabled>停止系统</button>
                </div>
                <div class="btn-group" style="margin-top:10px">
                    <button class="btn btn-primary" id="btnStartCamera" onclick="startCamera()" disabled>开启摄像头</button>
                    <button class="btn btn-secondary" id="btnStopCamera" onclick="stopCamera()" disabled>关闭摄像头</button>
                </div>
                <div class="upload-area" role="button" tabindex="0" aria-label="上传视频文件"
                     onclick="document.getElementById('videoFile').click()"
                     onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); document.getElementById('videoFile').click(); }">
                    <input type="file" id="videoFile" accept="video/*" onchange="uploadVideo(this)">
                    <p>点击上传视频文件</p>
                    <small>支持 mp4, avi, mov 等格式</small>
                </div>
                <div class="btn-group" style="margin-top:10px">
                    <button class="btn btn-secondary" id="btnStopVideo" onclick="stopVideo()" disabled>停止视频</button>
                </div>
            </div>

            <div class="panel-card">
                <h3>系统状态</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">FPS</div>
                        <div class="status-value normal" id="fpsValue">0</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">检测目标</div>
                        <div class="status-value normal" id="objectCount">0</div>
                    </div>
                </div>
                <div class="risk-indicator">
                    <div class="risk-dot safe" id="riskDot"></div>
                    <div>
                        <div class="status-label">风险等级</div>
                        <div class="status-value" id="riskLevel">安全</div>
                    </div>
                    <div style="margin-left:auto;text-align:right">
                        <div class="status-label">场景</div>
                        <div class="status-value" id="sceneType" style="font-size:16px">-</div>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <h3>警告信息</h3>
                <div class="message-area" id="messageArea" aria-live="polite">
                    <div class="message info">系统就绪，请启动系统开始检测</div>
                </div>
                <div class="timeline" id="timeline" aria-label="播报时间线"></div>
            </div>

            <div class="panel-card">
                <h3>检测结果</h3>
                <div class="detection-list" id="detectionList">
                    <div class="message info">暂无检测结果</div>
                </div>
            </div>

            <div class="panel-card">
                <h3>智能对话
                    <span class="agent-badge off" id="agentBadge">本地回退</span>
                </h3>
                <p class="safety-note" role="note">环境辅助提示，不构成通行许可。请始终结合盲杖、交通规则和现场判断。</p>
                <div class="chat-box" id="chatBox" role="log" aria-label="对话记录">
                    <div class="chat-msg bot"><div class="role">导盲助手</div>你好，我可以描述周围环境，但不能批准通行。例如"前面有什么"</div>
                </div>
                <div class="chip-row" id="chipRow">
                    <button class="chip" onclick="quickAsk('前面有什么')">前面有什么</button>
                    <button class="chip" onclick="quickAsk('现在能过马路吗')">现在能过马路吗</button>
                    <button class="chip" onclick="quickAsk('周围有什么危险')">周围有什么危险</button>
                    <button class="chip" onclick="quickAsk('读一下路牌上的字')">读一下路牌上的字</button>
                </div>
                <div class="chat-input-row">
                    <input id="chatInput" type="text" placeholder="问我周围有什么... (按 / 聚焦)"
                           aria-label="输入问题" onkeydown="if(event.key==='Enter')sendChat()">
                    <button class="btn btn-secondary mic-btn" id="btnMic" onclick="toggleMic()" title="语音输入" aria-label="语音输入">🎤</button>
                    <button class="btn btn-primary" id="btnSend" onclick="sendChat()" aria-label="发送">发送</button>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const AUTH_TOKEN = {{ auth_token|tojson }};
        const VIDEO_FEED_URL = {{ video_feed_url|tojson }};
        let systemRunning = false;
        let cameraActive = false;
        let videoActive = false;
        let videoPaused = false;
        let currentSpeed = 1.0;
        let videoTotal = 0;
        let statusInterval = null;
        let chatRequestQueue = Promise.resolve();

        function apiFetch(url, options = {}) {
            const requestOptions = { ...options };
            const headers = new Headers(options.headers || {});
            if (AUTH_TOKEN) headers.set('X-BlindGuard-Token', AUTH_TOKEN);
            requestOptions.headers = headers;
            return fetch(url, requestOptions);
        }

        function refreshedVideoFeedUrl() {
            const url = new URL(VIDEO_FEED_URL, window.location.origin);
            if (AUTH_TOKEN) url.searchParams.set('token', AUTH_TOKEN);
            url.searchParams.set('_', Date.now().toString());
            return url.pathname + url.search;
        }

        function showVideoFeed() {
            document.getElementById('videoFeed').style.visibility = 'visible';
            hideVideoPlaceholder();
        }

        function clearOverlay() {
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function setVideoPlaceholder(text) {
            const ph = document.getElementById('videoPlaceholder');
            if (!ph) return;
            if (text) document.getElementById('videoPlaceholderText').textContent = text;
            ph.style.display = 'flex';
        }

        function hideVideoPlaceholder() {
            const ph = document.getElementById('videoPlaceholder');
            if (ph) ph.style.display = 'none';
        }

        function hideVideoFeed() {
            document.getElementById('videoFeed').style.visibility = 'hidden';
            clearOverlay();
            setVideoPlaceholder('尚未开始检测');
        }

        document.getElementById('videoFeed').addEventListener('error', () => {
            // 视频流中断时给出可见提示，而不是无声黑屏
            if (systemRunning && (cameraActive || videoActive)) {
                setVideoPlaceholder('视频流连接中断，请检查摄像头或重新开启');
            }
        });

        // 系统控制
        async function startSystem() {
            try {
                const res = await apiFetch('/api/system/start', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    systemRunning = true;

        async function seekVideo(event) {
            if (!videoActive || videoTotal <= 0) {
                showMessage('回跳仅支持已加载视频', 'warning');
                return;
            }
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const percent = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
            const targetFrame = Math.min(videoTotal - 1, Math.floor(percent * videoTotal));
            await seekToFrame(targetFrame, '已回跳到目标位置');
        }

        async function seekVideoByKeyboard(event) {
            const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'];
            if (!keys.includes(event.key)) return;
            event.preventDefault();
            if (!videoActive || videoTotal <= 0) {
                showMessage('回跳仅支持已加载视频', 'warning');
                return;
            }
            const bar = document.getElementById('progressBar');
            const current = Number(bar.getAttribute('aria-valuenow') || 0);
            const pageStep = Math.max(1, Math.round(videoTotal * 0.1));
            const lineStep = Math.max(1, Math.round(videoTotal * 0.01));
            let target = current;
            if (event.key === 'Home') target = 0;
            else if (event.key === 'End') target = videoTotal - 1;
            else if (event.key === 'ArrowLeft') target -= lineStep;
            else if (event.key === 'ArrowRight') target += lineStep;
            else if (event.key === 'PageUp') target -= pageStep;
            else if (event.key === 'PageDown') target += pageStep;
            target = Math.min(videoTotal - 1, Math.max(0, target));
            await seekToFrame(target, `已回跳到 ${formatTime(target)}`);
        }

        // 状态轮询
        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);
            if (document.hidden) return;  // 后台标签页不轮询，省电省 CPU
            statusInterval = setInterval(updateStatus, 500);
        }

        // 标签页切到后台暂停轮询，切回前台且系统运行中则恢复
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopStatusPolling();
            } else if (systemRunning) {
                startStatusPolling();
                updateStatus();
            }
        });

        function syncVideoTotal(total) {
            videoTotal = Math.max(0, Number(total) || 0);
            document.getElementById('timeDisplay').dataset.total = videoTotal;
            document.getElementById('progressBar')
                .setAttribute('aria-valuemax', String(videoTotal));
        }

        function resetVideoProgress() {
            syncVideoTotal(0);
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('timeDisplay').textContent = '0:00 / 0:00';
            const bar = document.getElementById('progressBar');
            bar.setAttribute('aria-valuenow', '0');
            bar.setAttribute('aria-valuetext', '0:00 / 0:00');
        }

        function stopStatusPolling() {
            if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
        }

        function formatTime(frames, fps) {
            if (!fps) fps = 30;
            const seconds = Math.floor(frames / fps);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function updateStatus() {
            // 系统状态与检测结果并发拉取，任一路失败不影响另一路
            const statusPromise = apiFetch('/api/system/status')
                .then((r) => r.json()).catch(() => null);
            const detectionsPromise = apiFetch('/api/detections')
                .then((r) => r.json()).catch(() => null);
            const RISK_NAMES = { safe: '安全', low: '低风险', medium: '中等风险', high: '高风险', critical: '极高风险' };
            try {
                // 更新系统状态
                const data = await statusPromise;
                if (data === null) throw new Error('status fetch failed');
                document.getElementById('fpsValue').textContent = Math.round(data.fps || 0);
                document.getElementById('objectCount').textContent = data.detection_count || 0;

                // 整体风险等级（由后端 RiskEvaluator 综合评估）
                const risk = Object.prototype.hasOwnProperty.call(RISK_NAMES, data.overall_risk)
                    ? data.overall_risk : 'safe';
                document.getElementById('riskDot').className = 'risk-dot ' + risk;
                const riskLevelEl = document.getElementById('riskLevel');
                riskLevelEl.textContent = RISK_NAMES[risk];
                riskLevelEl.className = 'status-value risk-text ' + risk;

                // 场景类型
                document.getElementById('sceneType').textContent = data.scene_type_cn || '-';

                // 播报时间线（点击可回跳视频位置）
                if (data.events) {
                    const tl = document.getElementById('timeline');
                    const timelineSignature = data.events.map((event) => (
                        `${event.frame || ''}|${event.time || ''}|${event.text || ''}|${event.level || ''}`
                    )).join('\n');
                    if (tl.dataset.signature !== timelineSignature) {
                        const focusedFrame = document.activeElement
                            ?.closest?.('.timeline-item.seekable')?.dataset.frame;
                        tl.replaceChildren();
                        data.events.forEach((event) => {
                            const item = document.createElement('div');
                            const level = ['critical', 'high', 'medium', 'low', 'safe'].includes(event.level)
                                ? event.level : 'safe';
                            item.className = `timeline-item ${level}${event.frame ? ' seekable' : ''}`;
                            if (event.frame) {
                                item.dataset.frame = String(event.frame);
                                item.setAttribute('role', 'button');
                                item.tabIndex = 0;
                                item.setAttribute(
                                    'aria-label',
                                    `回跳到 ${event.time || ''} ${event.text || ''}`.trim()
                                );
                                item.addEventListener('click', () => seekToFrame(event.frame));
                                item.addEventListener('keydown', (keyEvent) => {
                                    if (keyEvent.key === 'Enter' || keyEvent.key === ' ') {
                                        keyEvent.preventDefault();
                                        seekToFrame(event.frame);
                                    }
                                });
                            }
                            const time = document.createElement('span');
                            time.className = 'tl-time';
                            time.textContent = event.time || '';
                            item.appendChild(time);
                            item.appendChild(document.createTextNode(' · '));
                            item.appendChild(document.createTextNode(event.text || ''));
                            tl.appendChild(item);
                        });
                        if (focusedFrame) {
                            const replacement = Array.from(
                                tl.querySelectorAll('.timeline-item.seekable')
                            ).find((item) => item.dataset.frame === focusedFrame);
                            if (replacement) {
                                replacement.focus({ preventScroll: true });
                            }
                        }
                        tl.dataset.signature = timelineSignature;
                    }
                }
                window._fw = data.frame_w || window._fw;
                window._fh = data.frame_h || window._fh;

                // 最新播报
                if (data.last_message) {
                    showMessage(data.last_message, risk === 'critical' || risk === 'high' ? 'warning' : 'info');
                }

                // 更新视频进度
                if (data.video_active) {
                    const pos = data.video_position || 0;
                    syncVideoTotal(data.video_total);
                    const total = videoTotal || 1;
                    const percent = (pos / total * 100).toFixed(1);
                    document.getElementById('progressFill').style.width = percent + '%';

                    const timeDisplay = document.getElementById('timeDisplay');
                    timeDisplay.textContent = `${formatTime(pos)} / ${formatTime(total)}`;
                    const progressBar = document.getElementById('progressBar');
                    progressBar.setAttribute('aria-valuenow', String(pos));
                    progressBar.setAttribute(
                        'aria-valuetext',
                        `${formatTime(pos)} / ${formatTime(total)}`
                    );

                    // 更新暂停按钮
                    videoPaused = data.video_paused;
                    document.getElementById('btnPause').textContent = videoPaused ? '播放' : '暂停';

                    // 更新倍速按钮
                    if (data.video_speed !== currentSpeed) {
                        currentSpeed = data.video_speed;
                        syncSpeedButtons(currentSpeed);
                    }
                }
            } catch (e) {}

            // 更新检测结果
            try {
                const data = await detectionsPromise;
                if (data === null) throw new Error('detections fetch failed');
                const list = document.getElementById('detectionList');
                const scrollTop = list.scrollTop;  // 记录滚动位置，重建后恢复
                list.replaceChildren();
                if (!data.detections || data.detections.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'message info';
                    empty.textContent = '暂无检测结果';
                    list.appendChild(empty);
                    drawOverlay([], window._fw, window._fh);  // 清空残留标注框
                    return;
                }
                data.detections.forEach(det => {
                    // 轨迹置信度优先（目标历史最高确认度，稳定），单帧置信度兜底
                    const confV = det.conf_stable != null ? det.conf_stable
                        : (det.conf_smooth != null ? det.conf_smooth : det.confidence);
                    const conf = Math.max(0, Math.min(100, Number(confV || 0) * 100)).toFixed(1);
                    const risk = ['critical', 'high', 'medium', 'low', 'safe'].includes(det.risk_level)
                        ? det.risk_level : 'safe';
                    const score = det.risk_score != null ? (det.risk_score * 100).toFixed(0) : '-';
                    const name = det.class_name_cn || det.class_name || '未知';
                    const zone = { left: '左侧', center: '正前方', right: '右侧' }[det.position_zone] || '';
                    const dur = det.track_age != null ? ` · 已出现 ${det.track_age}s` : '';
                    const item = document.createElement('div');
                    item.className = 'detection-item';
                    item.style.display = 'block';

                    const header = document.createElement('div');
                    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
                    const title = document.createElement('div');
                    const nameEl = document.createElement('b');
                    nameEl.textContent = name;
                    title.appendChild(nameEl);

                    if (det.light_state && det.light_state !== 'unknown') {
                        const lc = { red: '红灯', yellow: '黄灯', green: '绿灯' }[det.light_state];
                        if (lc) {
                            const tag = document.createElement('span');
                            tag.className = det.light_state === 'green' ? 'det-tag green' : 'det-tag warn';
                            tag.textContent = lc;
                            title.appendChild(tag);
                        }
                    }
                    if (det.trend === 'approaching' || det.trend === 'receding') {
                        const tag = document.createElement('span');
                        tag.className = det.trend === 'approaching' ? 'det-tag warn' : 'det-tag';
                        tag.textContent = det.trend === 'approaching' ? '↑接近中' : '↓远离';
                        title.appendChild(tag);
                    }
                    const riskDot = document.createElement('div');
                    riskDot.className = `risk-dot ${risk}`;
                    riskDot.title = RISK_NAMES[risk];
                    header.appendChild(title);
                    header.appendChild(riskDot);

                    const confBar = document.createElement('div');
                    confBar.className = 'conf-bar';
                    confBar.title = `轨迹置信度 ${conf}%（该目标历史最高确认度）`;
                    const confFill = document.createElement('i');
                    confFill.style.width = `${conf}%`;
                    confBar.appendChild(confFill);

                    const detail = document.createElement('div');
                    detail.className = 'det-sub';
                    detail.textContent = `轨迹置信度 ${conf}% · ${RISK_NAMES[risk]} ${score}分`
                        + (zone ? ` · ${zone}` : '') + dur;

                    item.appendChild(header);
                    item.appendChild(confBar);
                    item.appendChild(detail);
                    list.appendChild(item);
                });
                list.scrollTop = scrollTop;  // 恢复滚动位置，避免每 500ms 跳回顶部
                drawOverlay(data.detections, window._fw, window._fh);
            } catch (e) {}
        }

        function updateUI() {
            document.getElementById('btnStartSystem').disabled = systemRunning;
            document.getElementById('btnStopSystem').disabled = !systemRunning;
            document.getElementById('btnStartCamera').disabled = !systemRunning || cameraActive;
            document.getElementById('btnStopCamera').disabled = !cameraActive;
            document.getElementById('btnStopVideo').disabled = !videoActive;
        }

        function syncSpeedButtons(speed) {
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.textContent) === speed);
            });
        }

        function showMessage(text, type = 'info') {
            const area = document.getElementById('messageArea');
            const message = document.createElement('div');
            const safeType = ['info', 'warning'].includes(type) ? type : 'info';
            message.className = `message ${safeType}`;
            message.textContent = text;
            area.replaceChildren(message);
        }

        // ===== 语音输入：Web Speech API 优先，Whisper 浏览器内离线识别兜底 =====
        const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recog = null;
        let webSpeechOK = false;
        if (SpeechRecog) {
            try {
                recog = new SpeechRecog();
                recog.lang = 'zh-CN';
                recog.interimResults = false;
                recog.maxAlternatives = 1;
                recog.onresult = (e) => {
                    document.getElementById('chatInput').value = e.results[0][0].transcript;
                    sendChat();
                };
                recog.onend = () => setMicIdle();
                recog.onerror = () => setMicIdle();
                webSpeechOK = true;
            } catch (e) {
                webSpeechOK = false;
            }
        }

        function setMicStatus(text, listening = false) {
            const btn = document.getElementById('btnMic');
            btn.textContent = text || '🎤';
            btn.classList.toggle('listening', listening);
        }
        function setMicIdle() { setMicStatus('🎤'); }

        // Whisper：Transformers.js 浏览器内推理，模型经 hf-mirror 下载约 40MB（仅首次）
        let whisperPipe = null;
        let whisperLoading = false;
        let whisperRec = null;

        async function ensureWhisper() {
            if (whisperPipe) return whisperPipe;
            if (whisperLoading) return null;
            whisperLoading = true;
            try {
                setMicStatus('⏬ 模型…');
                const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
                mod.env.remoteHost = 'https://hf-mirror.com';
                whisperPipe = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                    dtype: 'q8',
                    progress_callback: (p) => {
                        if (p.status === 'progress' && p.progress)
                            setMicStatus(`⏬ ${Math.round(p.progress)}%`);
                    },
                });
                return whisperPipe;
            } catch (e) {
                setMicStatus('🎤✗');
                alert('语音模型加载失败（需联网下载约 40MB）：' + e.message);
                return null;
            } finally {
                whisperLoading = false;
            }
        }

        async function startWhisperRecord() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const src = ctx.createMediaStreamSource(stream);
            const proc = ctx.createScriptProcessor(4096, 1, 1);
            const chunks = [];
            proc.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
            src.connect(proc);
            proc.connect(ctx.destination);
            whisperRec = { ctx, stream, src, proc, chunks };
        }

        async function stopWhisperAndSend() {
            const rec = whisperRec;
            whisperRec = null;
            try {
                rec.proc.disconnect();
                rec.src.disconnect();
                rec.stream.getTracks().forEach((t) => t.stop());
                await rec.ctx.close();
            } catch (e) {}
            setMicStatus('🔎 识别中…');
            let audio = new Float32Array(rec.chunks.reduce((n, c) => n + c.length, 0));
            let off = 0;
            for (const c of rec.chunks) { audio.set(c, off); off += c.length; }
            try {
                const out = await whisperPipe(audio, { language: 'chinese', task: 'transcribe' });
                if (out.text && out.text.trim()) {
                    document.getElementById('chatInput').value = out.text.trim();
                    sendChat();
                }
            } catch (e) {
                alert('语音识别失败：' + e.message);
            }
            setMicIdle();
        }

        async function toggleMic() {
            const btn = document.getElementById('btnMic');
            if (btn.classList.contains('listening')) {
                if (whisperRec) { await stopWhisperAndSend(); return; }
                if (recog) { recog.stop(); return; }
            }
            if (webSpeechOK) {
                try { recog.start(); setMicStatus('🎤', true); } catch (e) {}
                return;
            }
            const pipe = await ensureWhisper();
            if (!pipe) return;
            try {
                await startWhisperRecord();
                setMicStatus('🎙 点击结束', true);
            } catch (e) {
                alert('无法访问麦克风：' + e.message);
                setMicIdle();
            }
        }

        // ===== 检测框中文覆盖层（后端画英文框，前端叠加中文标签与风险填色） =====
        let overlayOn = localStorage.getItem('bg_overlay') !== '0';
        const RISK_COLORS_CSS = { critical: '#ff0040', high: '#f45c43', medium: '#f4a261', low: '#667eea', safe: '#38ef7d' };

        function applyOverlay() {
            document.getElementById('overlay').style.display = overlayOn ? 'block' : 'none';
            const button = document.getElementById('btnOverlay');
            button.textContent = '标签层: ' + (overlayOn ? '开' : '关');
            button.setAttribute('aria-pressed', overlayOn ? 'true' : 'false');
        }
        function toggleOverlay() {
            overlayOn = !overlayOn;
            localStorage.setItem('bg_overlay', overlayOn ? '1' : '0');
            applyOverlay();
        }

        function drawOverlay(dets, fw, fh) {
            const canvas = document.getElementById('overlay');
            const cont = document.getElementById('videoContainer');
            const box = cont.getBoundingClientRect();
            if (!box.width) return;
            if (canvas.width !== Math.round(box.width) || canvas.height !== Math.round(box.height)) {
                canvas.width = Math.round(box.width);
                canvas.height = Math.round(box.height);
            }
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!overlayOn || !dets || !dets.length || !fw || !fh) return;
            const scale = Math.min(box.width / fw, box.height / fh);
            const dx = (box.width - fw * scale) / 2;
            const dy = (box.height - fh * scale) / 2;
            ctx.font = '12px "Microsoft YaHei", sans-serif';
            for (const det of dets) {
                const bb = det.bbox || [0, 0, 0, 0];
                if (bb.length < 4) continue;
                const X1 = dx + bb[0] * scale, Y1 = dy + bb[1] * scale;
                const X2 = dx + bb[2] * scale, Y2 = dy + bb[3] * scale;
                const color = RISK_COLORS_CSS[det.risk_level] || '#38ef7d';
                ctx.fillStyle = color + '22';
                ctx.fillRect(X1, Y1, X2 - X1, Y2 - Y1);
                const conf = Math.round((det.confidence || 0) * 100);
                let label = `${det.class_name_cn || det.class_name || '?'} ${conf}%`;
                if (det.light_state === 'red') label += ' 红灯';
                else if (det.light_state === 'green') label += ' 绿灯';
                if (det.trend === 'approaching') label += ' 接近中';
                const tw = ctx.measureText(label).width + 10;
                const ly = Math.max(16, Y1 - 6);
                ctx.fillStyle = color;
                ctx.fillRect(X1, ly - 14, tw, 18);
                ctx.fillStyle = '#0a0a14';
                ctx.fillText(label, X1 + 5, ly);
            }
        }

        async function seekToFrame(f, successMessage = '已回跳到事件发生位置') {
            if (!videoActive) { showMessage('回跳仅支持视频模式', 'info'); return; }
            try {
                const res = await apiFetch('/api/video/seek', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frame: f })
                });
                const data = await res.json();
                if (data.success) {
                    const actualFrame = Number.isFinite(Number(data.frame))
                        ? Number(data.frame)
                        : Number(f);
                    const total = videoTotal || 0;
                    const percent = total > 0
                        ? Math.min(100, Math.max(0, actualFrame / total * 100))
                        : 0;
                    const bar = document.getElementById('progressBar');
                    document.getElementById('progressFill').style.width = percent + '%';
                    document.getElementById('timeDisplay').textContent =
                        `${formatTime(actualFrame)} / ${formatTime(total)}`;
                    bar.setAttribute('aria-valuenow', String(actualFrame));
                    bar.setAttribute(
                        'aria-valuetext',
                        `${formatTime(actualFrame)} / ${formatTime(total)}`
                    );
                    showMessage(successMessage, 'info');
                } else {
                    showMessage('回跳失败: ' + (data.message || '未知错误'), 'warning');
                }
            } catch (e) {
                showMessage('回跳失败: ' + e.message, 'warning');
            }
        }

        // 大字高对比模式（低视力用户，localStorage 记忆）
        function applyContrastState() {
            const active = document.body.classList.contains('hc');
            const button = document.getElementById('btnContrast');
            button.setAttribute('aria-pressed', active ? 'true' : 'false');
            button.setAttribute('aria-label', active ? '关闭大字模式' : '开启大字模式');
            button.title = active ? '关闭大字模式' : '开启大字模式';
        }
        function toggleContrast() {
            document.body.classList.toggle('hc');
            localStorage.setItem('bg_hc', document.body.classList.contains('hc') ? '1' : '0');
            applyContrastState();
        }
        if (localStorage.getItem('bg_hc') === '1') {
            document.body.classList.add('hc');
        }
        applyContrastState();

        // 快捷提问
        function quickAsk(q) {
            document.getElementById('chatInput').value = q;
            sendChat();
        }

        // 键盘快捷键：/ 聚焦提问框，Esc 离开
        document.addEventListener('keydown', (e) => {
            const input = document.getElementById('chatInput');
            if (e.key === '/' && document.activeElement !== input) {
                e.preventDefault();
                input.focus();
            } else if (e.key === 'Escape' && document.activeElement === input) {
                input.blur();
            }
        });

        // 智能对话
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if (!q) return;
            input.value = '';
            appendChat('user', q);
            const pending = appendChat('bot', '思考中...');
            chatRequestQueue = chatRequestQueue.then(async () => {
                try {
                    const res = await apiFetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: q })
                    });
                    const data = await res.json();
                    const reply = data.success
                        ? data.reply
                        : '抱歉，出错了：' + data.message;
                    replaceChatMessage(pending, 'bot', reply);
                } catch (e) {
                    replaceChatMessage(pending, 'bot', '网络错误：' + e.message);
                }
            });
            return chatRequestQueue;
        }

        function appendChat(role, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            const label = role === 'user' ? '我' : '导盲助手';
            const roleEl = document.createElement('div');
            roleEl.className = 'role';
            roleEl.textContent = label;
            div.appendChild(roleEl);
            div.appendChild(document.createTextNode(text));
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        function replaceChatMessage(oldElement, role, text) {
            if (!oldElement || !oldElement.isConnected) return;
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            const label = role === 'user' ? '我' : '导盲助手';
            const roleEl = document.createElement('div');
            roleEl.className = 'role';
            roleEl.textContent = label;
            div.appendChild(roleEl);
            div.appendChild(document.createTextNode(text));
            oldElement.replaceWith(div);
            box.scrollTop = box.scrollHeight;
        }

        // 智能体状态轮询
        async function updateAgentStatus() {
            try {
                const res = await apiFetch('/api/agent/status');
                const data = await res.json();
                const badge = document.getElementById('agentBadge');
                if (!data.enabled) {
                    badge.textContent = '未启用';
                    badge.className = 'agent-badge off';
                } else if (data.llm_active) {
                    let label = data.model;
                    if (data.vision_active) label += ' · 视觉';
                    badge.textContent = label;
                    badge.className = 'agent-badge on';
                } else {
                    badge.textContent = '本地回退';
                    badge.className = 'agent-badge off';
                }
            } catch (e) {}
        }

        async function syncSystemState() {
            try {
                const res = await apiFetch('/api/system/status');
                const data = await res.json();
                systemRunning = Boolean(data.running);
                cameraActive = Boolean(data.camera_active);
                videoActive = Boolean(data.video_active);
                videoPaused = Boolean(data.video_paused);
                currentSpeed = Number(data.video_speed || 1.0);
                updateUI();

                const controls = document.getElementById('videoControls');
                if (videoActive) {
                    controls.style.display = 'grid';
                    document.getElementById('videoFeed').src = refreshedVideoFeedUrl();
                    document.getElementById('btnPause').textContent = videoPaused ? '播放' : '暂停';
                    showVideoFeed();
                } else if (cameraActive) {
                    controls.style.display = 'none';
                    showVideoFeed();
                } else {
                    controls.style.display = 'none';
                    hideVideoFeed();
                }
                await updateStatus();
                if (systemRunning) {
                    startStatusPolling();
                } else {
                    stopStatusPolling();
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', async () => {
            updateUI();
            updateAgentStatus();
            applyOverlay();
            await syncSystemState();
            setInterval(updateAgentStatus, 3000);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
        });
    </script>
</body>
