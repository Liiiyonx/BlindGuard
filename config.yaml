# ============================================
# BlindGuard 智能导盲系统 V1.0 - 配置文件
# ============================================

# 摄像头配置
camera:
  index: 0                  # 摄像头索引，0 为默认摄像头
  width: 640                # 视频宽度
  height: 480               # 视频高度
  fps: 30                   # 目标帧率

# YOLOv10 检测模型配置
detector:
  # 主模型：通用交通类（v3 = COCO train2017 全量 3.5 万张 7 类 GPU 重训）
  # 训练产物 runs/detect/blindguard_v3/weights/best.pt 已复制为 best_v3.pt
  model_path: "best_v3.pt"
  confidence: 0.6           # 置信度阈值（抽检证据：0.53-0.73 区间误检集中，宁漏勿误）
  iou_threshold: 0.45       # IoU 阈值（可调）
  device: ""                # 推理设备：""=自动(有GPU用GPU), "cpu", "cuda:0"
  img_size: 640             # 推理图像尺寸
  # 主模型只检测这些类别（与主模型 7 类一一对应）
  focus_classes:
    - "person"
    - "bicycle"
    - "car"
    - "motorcycle"
    - "bus"
    - "truck"
    - "traffic_light"
  # 辅助模型：定制类专家（井盖/盲道/公共设施）。留空 "" 关闭双模型
  aux_model_path: "best.pt"
  # 辅助模型类别白名单——旧模型的 person→car / 手套→bicycle 误检被此白名单直接拦截
  aux_classes:
    - "manhole_cover"
    - "public_facility"
    - "tactile_paving"

# 危险判断引擎配置（阈值可调）
risk_engine:
  # 面积占比阈值（目标面积 / 画面总面积），与代码内距离分档一一对应
  area_thresholds:
    very_close: 0.15        # 面积占比 >= 15% 视为非常近
    close: 0.10             # >= 10% 视为近
    medium: 0.05            # >= 5% 视为中等距离
    far: 0.01               # >= 1% 视为较远，更低为非常远

  # 危险等级：high=高危, medium=中等, low=低危, safe=安全
  # 高危类别（靠近即危险）
  high_risk_classes:
    - "car"
    - "truck"
    - "bus"
    - "motorcycle"
    - "bicycle"
    - "train"
    - "fire hydrant"
    - "manhole_cover"       # 井盖（缺失/破损对视障人士极其危险）

  # 中等危险类别（障碍物）
  medium_risk_classes:
    - "person"
    - "dog"
    - "cat"
    - "chair"
    - "bench"
    - "potted plant"
    - "suitcase"
    - "backpack"
    - "umbrella"
    - "stop sign"
    - "parking meter"
    - "public_facility"     # 公共设施（可能形成障碍）
    - "traffic_light"       # 红绿灯（需要关注通行信号）

  # 低危类别（一般物品）
  low_risk_classes:
    - "bottle"
    - "cup"
    - "book"
    - "cell phone"
    - "laptop"
    - "mouse"
    - "keyboard"
    - "tv"
    - "remote"
    - "clock"
    - "tactile_paving"      # 盲道（引导设施，本身非障碍）

# 语音播报配置
announcer:
  engine: "pyttsx3"         # 语音引擎：pyttsx3 或 edge-tts
  rate: 180                 # 语速（pyttsx3 专用）
  volume: 1.0               # 音量 0.0 - 1.0
  cooldown: 3.0             # 相同内容播报冷却时间（秒）

# ============================================
# 智能体（Agent）配置
# 在原有 CV 管线上叠加 LLM 推理，实现自然播报、工具调用对话、时序记忆。
# 未配置 api_key 或调用失败时自动回退到模板播报，系统仍可完整运行。
# 支持任意 OpenAI 兼容端点（DeepSeek/通义千问/智谱GLM/OpenAI）。
# 也可通过环境变量覆盖：BLINDGUARD_AGENT_LLM_API_KEY 等。
# ============================================
agent:
  enabled: true             # 是否启用智能体层
  llm:
    base_url: "https://api.deepseek.com/v1"   # OpenAI 兼容端点
    api_key: ""             # 留空！密钥写入 .env 的 BLINDGUARD_AGENT_LLM_API_KEY（.env 已被 gitignore）
    model: "deepseek-chat"  # 模型名
    temperature: 0.6        # 采样温度
    timeout: 8              # 请求超时（秒）
  vision:                   # 可选：多模态视觉端点（Agent 的"看图"工具 look_at_frame）
    base_url: ""            # 如 "https://open.bigmodel.cn/api/paas/v4"
    api_key: ""             # 留空！或环境变量 BLINDGUARD_AGENT_VISION_API_KEY
    model: ""               # 如 "glm-4v-flash" / "qwen-vl-plus"
    timeout: 20             # 看图请求超时（秒），比文本请求慢属正常
  announce:
    cooldown: 3.0           # 播报冷却（秒），避免每帧都调 LLM
    memory_size: 8          # 时序记忆滑动窗口帧数
    min_level: "medium"     # 主动播报最低风险等级：low/safe 目标只可查询不主动播报（分级告警）
    min_confidence: 0.45    # 低于该置信度的目标不主动播报（宁可漏报不误报）
  chat:
    max_history: 6          # 对话保留的历史轮数

# 日志配置
logger:
  enabled: true             # 是否启用日志记录
  log_dir: "logs"           # 日志目录
  max_rows: 10000           # 单个 CSV 文件最大行数

# Flask 服务器配置
server:
  host: "0.0.0.0"           # 监听地址
  port: 5000                # 监听端口
  debug: false              # 调试模式

