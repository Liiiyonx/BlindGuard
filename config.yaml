# ============================================
# BlindGuard 智能导盲系统 V1.0 - 配置文件
# ============================================

# 摄像头配置
camera:
  index: 0                  # 摄像头索引，0 为默认摄像头
  width: 640                # 视频宽度
  height: 480               # 视频高度
  fps: 30                   # 目标帧率

# YOLOv10 检测模型配置
detector:
  model_path: "best.pt"     # 模型文件路径（使用训练好的自定义模型）
  confidence: 0.5           # 置信度阈值（可调）
  iou_threshold: 0.45       # IoU 阈值（可调）
  device: ""                # 推理设备：""=自动, "cpu", "cuda:0"
  img_size: 640             # 推理图像尺寸

# 危险判断引擎配置（阈值可调）
risk_engine:
  # 面积占比阈值（目标面积 / 画面总面积）
  area_thresholds:
    close: 0.15             # 近距离阈值：面积占比 >= 15% 视为非常近
    medium: 0.05            # 中距离阈值：面积占比 >= 5% 视为中等距离
    far: 0.01               # 远距离阈值：面积占比 >= 1% 视为较远

  # 危险等级：high=高危, medium=中等, low=低危, safe=安全
  # 高危类别（靠近即危险）
  high_risk_classes:
    - "car"
    - "truck"
    - "bus"
    - "motorcycle"
    - "bicycle"
    - "train"
    - "fire hydrant"

  # 中等危险类别（障碍物）
  medium_risk_classes:
    - "person"
    - "dog"
    - "cat"
    - "chair"
    - "bench"
    - "potted plant"
    - "suitcase"
    - "backpack"
    - "umbrella"
    - "stop sign"
    - "parking meter"

  # 低危类别（一般物品）
  low_risk_classes:
    - "bottle"
    - "cup"
    - "book"
    - "cell phone"
    - "laptop"
    - "mouse"
    - "keyboard"
    - "tv"
    - "remote"
    - "clock"

# 语音播报配置
announcer:
  engine: "pyttsx3"         # 语音引擎：pyttsx3 或 edge-tts
  rate: 180                 # 语速（pyttsx3 专用）
  volume: 1.0               # 音量 0.0 - 1.0
  cooldown: 3.0             # 相同内容播报冷却时间（秒）

# 日志配置
logger:
  enabled: true             # 是否启用日志记录
  log_dir: "logs"           # 日志目录
  max_rows: 10000           # 单个 CSV 文件最大行数

# Flask 服务器配置
server:
  host: "0.0.0.0"           # 监听地址
  port: 5000                # 监听端口
  debug: false              # 调试模式

